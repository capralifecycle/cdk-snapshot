name: ci

on:
  push:
    branches: [master, main]
  pull_request:

defaults:
  run:
    # Stricter than the default GitHub Actions shell options.
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency: ci-${{ github.ref }}-${{ github.workflow }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release pushes tags and a release
      issues: write
      pull-requests: write
      id-token: write # npm publish with provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release reads the tag history
          # semantic-release authenticates its own pushes from GITHUB_TOKEN,
          # so the checkout credentials never need to outlive the clone.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      # The snapshot matrix runs the same fixture under node:test, and
      # semantic-release runs on Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"

      - run: make ci

      - name: release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run semantic-release
